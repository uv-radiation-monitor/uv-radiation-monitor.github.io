<style>
:root{--bg:#f4f6fb;--card:#fff;--bd:#e3e8f2;--tx:#1f2a44;--mut:#6b7a99;--ac:#4e73df;--ok:#1cc88a;--warn:#f6c23e;--bad:#e74a3b;--sh:0 2px 10px rgba(31,42,68,.07)}
:root[data-theme=dark]{--bg:#0f1626;--card:#182138;--bd:#263252;--tx:#e8eefc;--mut:#93a0bf;--ac:#6f90f0;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{background:linear-gradient(135deg,#1e2a5a,#4e73df);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px}
.org{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.org img{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:14px;padding:3px;flex:none}
.org div{text-align:center;font-size:.74rem;line-height:1.6;font-weight:600}
.org b{display:block;font-size:.88rem}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.2rem;margin:0;font-weight:800}
h1 small{display:block;font-size:.74rem;color:var(--mut);font-weight:400}
.btns{display:flex;gap:6px}
.btns button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;border-radius:10px;padding:8px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ib{border-inline-start:5px solid var(--sc,var(--ac))}
h2{font-size:.95rem;margin:0 0 8px;color:var(--ac)}
.st{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:10px 14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mut)}
.hero{text-align:center;border:2px solid var(--lv,var(--bd))}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.val{font-size:3.4rem;font-weight:800;line-height:1;color:var(--lv,var(--mut))}
.u{font-size:.75rem;color:var(--mut)}
.lvl{display:inline-block;margin-top:10px;padding:4px 20px;border-radius:99px;background:var(--lv,var(--mut));color:#fff;font-weight:700}
.msg{margin:8px 0 0;color:var(--mut);font-size:.9rem}
.alarm{animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(231,74,59,.25)}}
.g{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.g{grid-template-columns:repeat(3,1fr)}}
.sc{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0}
.sc>div:first-child{flex:1}
.lab{font-size:.74rem;font-weight:800;color:var(--sc,var(--ac))}
.sc b{display:block;font-size:1.5rem;line-height:1.3}
.ic{font-size:1.9rem}
.pb{height:8px;background:var(--bd);border-radius:9px;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:9px;transition:width .6s}
.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tip{background:rgba(78,115,223,.07);border:2px solid var(--bd);border-radius:14px;padding:12px 8px;text-align:center;font-size:.8rem;line-height:1.45}
.tip i{display:block;font-style:normal;font-size:2.3rem;line-height:1.2;margin-bottom:4px}
.tip.o{border-color:var(--ok)}.tip.w{border-color:var(--warn)}.tip.b{border-color:var(--bad)}
.spark{width:100%;height:90px}
.leg{display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.leg div,.li{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;margin-bottom:6px}
.leg i.k,.chip{width:14px;height:14px;border-radius:5px;flex:none;margin-top:5px;display:block}
.li>i{font-style:normal;font-size:1.3rem;line-height:1.4}
.hero2{text-align:center}
.hero2 svg{width:100%;max-width:260px}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:6px 0 16px}
</style>
</head>
